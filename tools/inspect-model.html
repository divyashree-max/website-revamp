<!doctype html><html><head><title>Local asset inspection</title><style>body{margin:0;background:#080809;color:#eee;font:14px sans-serif}canvas{display:block}#label{position:absolute;top:20px;left:20px}</style><script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script></head><body><div id="label"></div><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const p=new URLSearchParams(location.search),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#080809');scene.add(new T.HemisphereLight(0xffffff,0x24201b,2));const key=new T.DirectionalLight(0xffffff,4);key.position.set(4,7,5);scene.add(key);const rim=new T.DirectionalLight(0xf7a504,3);rim.position.set(-4,4,-4);scene.add(rim);const pm=new T.PMREMGenerator(renderer);scene.environment=pm.fromScene(new RoomEnvironment(),.08).texture;scene.environmentIntensity=.5;
const gltf=await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync(p.has('original')?'/source-assets/KUKA+Display.glb':'/public/assets/kuka-display.web.glb');scene.add(gltf.scene);let mixer;
if(p.has('clip')){mixer=new T.AnimationMixer(gltf.scene);const clip=gltf.animations[Number(p.get('clip'))];mixer.clipAction(clip).play();mixer.setTime(Number(p.get('time')||0));document.querySelector('#label').textContent=clip.name+' · '+p.get('time')+'s';}else document.querySelector('#label').textContent='Original authored pose · no clip playing';
gltf.scene.updateMatrixWorld(true);const bounds=new T.Box3().setFromObject(gltf.scene),center=bounds.getCenter(new T.Vector3()),size=bounds.getSize(new T.Vector3());const camera=new T.PerspectiveCamera(38,innerWidth/innerHeight,.01,500);const angle=Number(p.get('angle')||.7),dist=size.length()*1.05;camera.position.copy(center).add(new T.Vector3(Math.sin(angle)*dist,size.y*.3,Math.cos(angle)*dist));camera.lookAt(center);renderer.render(scene,camera);
const nodes=[];gltf.scene.traverse(o=>{if(/Bone|Base|LED|Armature/.test(o.name)){const b=new T.Box3().setFromObject(o);nodes.push({name:o.name,type:o.type,position:o.getWorldPosition(new T.Vector3()).toArray(),bounds:b.isEmpty()?null:{min:b.min.toArray(),max:b.max.toArray()},materials:o.material?(Array.isArray(o.material)?o.material:[o.material]).map(m=>m.name):null})}});
window.inspection={ready:true,bounds:{min:bounds.min.toArray(),max:bounds.max.toArray()},size:size.toArray(),nodes,clips:gltf.animations.map(c=>({name:c.name,duration:c.duration})),materials:[]};
const seen=new Set();gltf.scene.traverse(o=>{for(const m of o.material?(Array.isArray(o.material)?o.material:[o.material]):[]){if(seen.has(m))continue;seen.add(m);window.inspection.materials.push({name:m.name,color:m.color?.toArray(),metalness:m.metalness,roughness:m.roughness})}if(o.material?.name==='Display.001'){window.inspection.face={name:o.name,matrix:o.matrixWorld.toArray(),localBounds:(o.geometry.computeBoundingBox(),{min:o.geometry.boundingBox.min.toArray(),max:o.geometry.boundingBox.max.toArray()}),normal:Array.from(o.geometry.attributes.normal.array.slice(0,3)),uv:Array.from(o.geometry.attributes.uv.array.slice(0,12))}}});
</script></body></html>
